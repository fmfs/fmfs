<svg viewBox="0 0 900 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="circuit divider">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PCB traces -->
  <g stroke="#0A66C2" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path id="t1" d="M0 30 H120 L150 14 H360 L390 30 H560 L590 14 H760 L790 30 H900"/>
    <path id="t2" d="M0 18 H80 L110 42 H300 L330 18 H520 L550 42 H700 L730 18 H900"/>
    <path id="t3" d="M0 44 H200 L235 30 H470 L505 44 H680 L715 30 H900"/>
  </g>

  <!-- solder pads / vias -->
  <g fill="#00B4D8" filter="url(#glow)">
    <circle cx="150" cy="14" r="3.2"/>
    <circle cx="390" cy="30" r="3.2"/>
    <circle cx="590" cy="14" r="3.2"/>
    <circle cx="110" cy="42" r="3.2"/>
    <circle cx="330" cy="18" r="3.2"/>
    <circle cx="550" cy="42" r="3.2"/>
    <circle cx="235" cy="30" r="3.2"/>
    <circle cx="505" cy="44" r="3.2"/>
    <circle cx="715" cy="30" r="3.2"/>
  </g>

  <!-- flowing current -->
  <g fill="#7DF9FF" filter="url(#glow)">
    <circle r="3">
      <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion>
    </circle>
    <circle r="3">
      <animateMotion dur="4.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion>
    </circle>
    <circle r="3">
      <animateMotion dur="4.0s" begin="1.6s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion>
    </circle>
    <circle r="3">
      <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion>
    </circle>
  </g>
</svg>
