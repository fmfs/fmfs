<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="oscilloscope banner">
  <defs>
    <filter id="trace-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="14" y="14" width="872" height="172" rx="10"/>
    </clipPath>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#03234B"/>
    </linearGradient>
  </defs>

  <!-- bezel + screen -->
  <rect x="4" y="4" width="892" height="192" rx="14" fill="url(#bezel)"/>
  <rect x="14" y="14" width="872" height="172" rx="10" fill="#06121f"/>

  <g clip-path="url(#screen)">
    <!-- grid -->
    <g stroke="#0A66C2" stroke-width="1" opacity="0.18">
      <line x1="100" y1="14" x2="100" y2="186"/>
      <line x1="200" y1="14" x2="200" y2="186"/>
      <line x1="300" y1="14" x2="300" y2="186"/>
      <line x1="400" y1="14" x2="400" y2="186"/>
      <line x1="500" y1="14" x2="500" y2="186"/>
      <line x1="600" y1="14" x2="600" y2="186"/>
      <line x1="700" y1="14" x2="700" y2="186"/>
      <line x1="800" y1="14" x2="800" y2="186"/>
      <line x1="14" y1="55" x2="886" y2="55"/>
      <line x1="14" y1="100" x2="886" y2="100"/>
      <line x1="14" y1="145" x2="886" y2="145"/>
    </g>
    <!-- center axis -->
    <line x1="14" y1="100" x2="886" y2="100" stroke="#00B4D8" stroke-width="1" opacity="0.35" stroke-dasharray="4 6"/>

    <!-- scrolling digital signal -->
    <g filter="url(#trace-glow)">
      <path fill="none" stroke="#00F5A0" stroke-width="3" stroke-linejoin="round"
        d="M0 70 H60 V130 H120 V70 H180 H240 V130 H300 V70 H360 V130 H420 H480 V70 H540 H600 H660 V130 H720 V70 H780 V130 H840 H900 V70 H960 V130 H1020 V70 H1080 H1140 V130 H1200 V70 H1260 V130 H1320 H1380 V70 H1440 H1500 H1560 V130 H1620 V70 H1680 V130 H1740 H1800">
        <animateTransform attributeName="transform" type="translate"
          from="0 0" to="-900 0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- HUD labels -->
  <g font-family="monospace" font-size="12" fill="#00F5A0">
    <circle cx="34" cy="34" r="4" fill="#00F5A0">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="38">SIGNAL: ACTIVE</text>
    <text x="770" y="38" fill="#00B4D8">CH1 · 5V/div</text>
    <text x="46" y="172" fill="#00B4D8">fmfs@sust:~$ flashing...</text>
  </g>
</svg>
