name: Generate 3D Contribution Graph

on:
  schedule:
    # runs once a day at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:   # run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - name: Generate the 3D graphs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # <-- this was missing before
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push the generated SVGs
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add -A .
          if git commit -m "chore: update 3d contribution graph"; then
            git push
          fi
